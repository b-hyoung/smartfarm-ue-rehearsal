<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1450" viewBox="0 0 1400 1450" role="img" aria-labelledby="title desc">
<title id="title">팬 운전 조건 탐색 및 모델 재학습 시퀀스 다이어그램</title>
<desc id="desc">사용자, 언리얼 엔진, AI 예측 모델, 볼륨 변환 모듈, OpenFOAM 사이의 제안 처리 순서. 사용자 조작에 따른 예측과 화면 갱신, 별도로 선정한 조건의 CFD 비교 검증과 데이터 추가 재학습을 표시한다.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#344f64"/></marker>
<marker id="return" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#344f64" stroke-width="1.5"/></marker>
</defs><rect width="1400" height="1450" fill="white"/>
<g font-family="Malgun Gothic, sans-serif" fill="#203848">
<rect x="40" y="165" width="1320" height="665" rx="12" fill="#f8fafc" stroke="#cbd5df" stroke-width="2"/>
<rect x="40" y="870" width="1320" height="430" rx="12" fill="#fffaf2" stroke="#c8ae8c" stroke-width="2"/>
<text x="62" y="204" font-size="24" font-weight="bold">(a) 팬 운전 조건 탐색 — AI·시각화 연계를 위한 제안 동작</text>
<text x="62" y="909" font-size="24" font-weight="bold" fill="#725331">(b) 별도 CFD 검증·재학습 — 선정한 조건에 대해 반복</text>
<line x1="130" y1="137" x2="130" y2="1330" stroke="#a5b5c1" stroke-width="1.6" stroke-dasharray="7 7"/><rect x="15" y="50" width="230" height="87" rx="11" fill="#f2f7fb" stroke="#607889" stroke-width="2"/><text x="130" y="86" text-anchor="middle" font-size="24" font-weight="bold">사용자</text><text x="130" y="116" text-anchor="middle" font-size="21"></text><line x1="400" y1="137" x2="400" y2="1330" stroke="#a5b5c1" stroke-width="1.6" stroke-dasharray="7 7"/><rect x="285" y="50" width="230" height="87" rx="11" fill="#eef8f2" stroke="#607889" stroke-width="2"/><text x="400" y="86" text-anchor="middle" font-size="24" font-weight="bold">언리얼 엔진 5</text><text x="400" y="116" text-anchor="middle" font-size="21">(UE5)</text><line x1="670" y1="137" x2="670" y2="1330" stroke="#a5b5c1" stroke-width="1.6" stroke-dasharray="7 7"/><rect x="555" y="50" width="230" height="87" rx="11" fill="#f4f2fa" stroke="#607889" stroke-width="2"/><text x="670" y="86" text-anchor="middle" font-size="24" font-weight="bold">AI 기류 예측 모델</text><text x="670" y="116" text-anchor="middle" font-size="21">(PINN / PINO)</text><line x1="940" y1="137" x2="940" y2="1330" stroke="#a5b5c1" stroke-width="1.6" stroke-dasharray="7 7"/><rect x="825" y="50" width="230" height="87" rx="11" fill="#eef8f2" stroke="#607889" stroke-width="2"/><text x="940" y="86" text-anchor="middle" font-size="24" font-weight="bold">볼륨 변환 모듈</text><text x="940" y="116" text-anchor="middle" font-size="21">(OpenVDB)</text><line x1="1210" y1="137" x2="1210" y2="1330" stroke="#a5b5c1" stroke-width="1.6" stroke-dasharray="7 7"/><rect x="1095" y="50" width="230" height="87" rx="11" fill="#fff8ee" stroke="#607889" stroke-width="2"/><text x="1210" y="86" text-anchor="middle" font-size="24" font-weight="bold">CFD 해석</text><text x="1210" y="116" text-anchor="middle" font-size="21">(OpenFOAM)</text><path d="M130 270 L400 270" fill="none" stroke="#344f64" stroke-width="2.5" marker-end="url(#arrow)"/><text x="265.0" y="257" text-anchor="middle" font-size="21">1. 팬 조건 조작</text><path d="M400 335 L670 335" fill="none" stroke="#344f64" stroke-width="2.5" marker-end="url(#arrow)"/><text x="535.0" y="322" text-anchor="middle" font-size="21">2. 변경된 조건 전달</text><path d="M670 367 H726 V404 H673" fill="none" stroke="#344f64" stroke-width="2.5" marker-end="url(#arrow)"/><text x="742" y="380" text-anchor="start" font-size="22">3. 기류 예측</text><path d="M670 450 L400 450" fill="none" stroke="#344f64" stroke-width="2.5" stroke-dasharray="9 6" marker-end="url(#return)"/><text x="535.0" y="437" text-anchor="middle" font-size="21">4. 예측 결과 반환</text><path d="M400 510 L940 510" fill="none" stroke="#344f64" stroke-width="2.5" marker-end="url(#arrow)"/><text x="670.0" y="497" text-anchor="middle" font-size="21">5. 예측 기류 데이터 전달 · 변환 요청</text><path d="M940 545 H996 V582 H943" fill="none" stroke="#344f64" stroke-width="2.5" marker-end="url(#arrow)"/><text x="1012" y="558" text-anchor="start" font-size="22">볼륨 데이터</text><text x="1012" y="586" text-anchor="start" font-size="22">변환</text><path d="M940 635 L400 635" fill="none" stroke="#344f64" stroke-width="2.5" stroke-dasharray="9 6" marker-end="url(#return)"/><text x="670.0" y="622" text-anchor="middle" font-size="22">시각화 데이터 반환</text><path d="M400 670 H456 V707 H403" fill="none" stroke="#344f64" stroke-width="2.5" marker-end="url(#arrow)"/><text x="472" y="683" text-anchor="start" font-size="22">화면 갱신</text><path d="M400 785 L130 785" fill="none" stroke="#344f64" stroke-width="2.5" stroke-dasharray="9 6" marker-end="url(#return)"/><text x="265.0" y="772" text-anchor="middle" font-size="20">6. 기류·예상 전력 확인</text><path d="M670 977 L1210 977" fill="none" stroke="#344f64" stroke-width="2.5" marker-end="url(#arrow)"/><text x="940.0" y="964" text-anchor="middle" font-size="22">선정한 추천 조건으로 추가 해석 요청</text><path d="M1210 1005 H1266 V1042 H1213" fill="none" stroke="#344f64" stroke-width="2.5" marker-end="url(#arrow)"/><text x="1186" y="1018" text-anchor="end" font-size="22">동일 조건 CFD 계산</text><path d="M1210 1100 L670 1100" fill="none" stroke="#344f64" stroke-width="2.5" stroke-dasharray="9 6" marker-end="url(#return)"/><text x="940.0" y="1087" text-anchor="middle" font-size="22">CFD 해석 결과 반환</text><path d="M670 1135 H726 V1172 H673" fill="none" stroke="#344f64" stroke-width="2.5" marker-end="url(#arrow)"/><text x="742" y="1148" text-anchor="start" font-size="22">재학습 전 예측값과 비교</text><path d="M670 1210 H726 V1247 H673" fill="none" stroke="#344f64" stroke-width="2.5" marker-end="url(#arrow)"/><text x="742" y="1223" text-anchor="start" font-size="22">CFD 데이터 누적 · 모델 재학습</text><text x="700" y="1280" font-size="20" fill="#725331">갱신된 모델을 이후 기류 예측에 사용</text><text x="700" y="1400" text-anchor="middle" font-size="25" font-weight="bold">그림 2. 팬 운전 조건 탐색 및 모델 재학습 시퀀스 다이어그램</text></g></svg>