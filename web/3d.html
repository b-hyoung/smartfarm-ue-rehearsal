<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>스마트팜 3D — 배광 미리보기</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body { background: #0d0d0d; color: #fff; overflow: hidden;
         font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  #hud { position: fixed; top: 16px; left: 20px; z-index: 5; }
  #hud h1 { font-size: 16px; font-weight: 650; }
  #hud .sub { font-size: 12px; color: #c3c2b7; margin-top: 4px; line-height: 1.6; }
  #hud a { color: #86b6ef; }
  #note { position: fixed; bottom: 14px; left: 20px; right: 20px; z-index: 5;
          font-size: 11.5px; color: #898781; }
  #btnLight { position: fixed; top: 16px; right: 20px; z-index: 5;
              background: #1a1a19; color: #fff; border: 1px solid #383835;
              border-radius: 8px; padding: 9px 14px; font-size: 13px; cursor: pointer; }
  #btnLight:hover { border-color: #898781; }
  canvas { display: block; }
</style>
</head>
<body>
<div id="hud">
  <h1>스마트팜 3D — 배광 미리보기</h1>
  <div class="sub">드래그 = 회전 · 휠 = 줌 · <a href="index.html">← 온도 대시보드</a></div>
</div>
<button id="btnLight">조명 끄기</button>
<div id="note">
  배광은 현재 <b>면광원 근사</b>(단당 240W급 식물등 가정) — 제조사 IES 파일이 오면
  같은 자리에 실측 배광 곡선을 꽂는다 · 방 8.0×5.7×2.7m (D자) · 재배단 2단 2.4×0.8m
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script>
const LX = 8.0, LY = 5.7, LZ = 2.7;          // 방 (m) — x, 깊이, 높이
const RACK = { x: 4.0, y: 2.0, w: 2.4, d: 0.8, beds: [0.55, 1.35],
               leds: [1.28, 1.60], postH: 1.75 };
const AC = { x: 4.0, y: 2.0, panel: 0.95 };

// three.js 는 y-업: 방 (x, y, z) -> 씬 (x, z=y, y=z)
const V = (x, y, z) => new THREE.Vector3(x, z, y);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d0d0d);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.05, 100);

/* ── 방: D자 바닥 + 윤곽 ─────────────────────────────── */
function dShape() {
  const s = new THREE.Shape();
  s.moveTo(0, 0);
  s.lineTo(LX, 0);
  s.absellipse(LX / 2, 0, LX / 2, LY, 0, Math.PI, false);
  return s;
}
const floor = new THREE.Mesh(
  new THREE.ShapeGeometry(dShape(), 48),
  new THREE.MeshStandardMaterial({ color: 0x8b8d90, roughness: 0.9 }));
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

// 윤곽: 바닥·천장 테두리 + 기둥
const edgePts = [];
for (let i = 0; i <= 64; i++) {
  const a = Math.PI - (i / 64) * Math.PI;
  edgePts.push(new THREE.Vector2(LX / 2 + Math.cos(a) * LX / 2, Math.sin(a) * LY));
}
edgePts.push(new THREE.Vector2(0, 0));
const edgeMat = new THREE.LineBasicMaterial({ color: 0x52514e });
for (const h of [0, LZ]) {
  const g = new THREE.BufferGeometry().setFromPoints(
    edgePts.map(p => V(p.x, p.y, h)));
  scene.add(new THREE.Line(g, edgeMat));
}
for (const p of [[0, 0], [LX, 0], [LX / 2, LY]]) {
  const g = new THREE.BufferGeometry().setFromPoints(
    [V(p[0], p[1], 0), V(p[0], p[1], LZ)]);
  scene.add(new THREE.Line(g, edgeMat));
}

/* ── 에어컨 (천장 카세트) ─────────────────────────────── */
const acMat = new THREE.MeshStandardMaterial({ color: 0xf2f3f5, roughness: 0.6 });
const acDark = new THREE.MeshStandardMaterial({ color: 0x17181c });
const panel = new THREE.Mesh(new THREE.BoxGeometry(AC.panel, 0.035, AC.panel), acMat);
panel.position.copy(V(AC.x, AC.y, LZ - 0.017));
scene.add(panel);
const ret = new THREE.Mesh(new THREE.BoxGeometry(0.57, 0.02, 0.57), acDark);
ret.position.copy(V(AC.x, AC.y, LZ - 0.045));
scene.add(ret);

/* ── 재배단 2단 ──────────────────────────────────────── */
const postMat = new THREE.MeshStandardMaterial({ color: 0x5a5d63, roughness: 0.5 });
const bedMat = new THREE.MeshStandardMaterial({ color: 0xcfd4d8, roughness: 0.85 });
const plantMat = new THREE.MeshStandardMaterial({ color: 0x3d7a3f, roughness: 0.95 });
for (const sx of [-1, 1]) for (const sy of [-1, 1]) {
  const post = new THREE.Mesh(
    new THREE.BoxGeometry(0.06, RACK.postH, 0.06), postMat);
  post.position.copy(V(RACK.x + sx * (RACK.w / 2 - 0.03),
                       RACK.y + sy * (RACK.d / 2 - 0.03), RACK.postH / 2));
  post.castShadow = true;
  scene.add(post);
}
for (const z of RACK.beds) {
  const bed = new THREE.Mesh(
    new THREE.BoxGeometry(RACK.w, 0.05, RACK.d), bedMat);
  bed.position.copy(V(RACK.x, RACK.y, z));
  bed.castShadow = bed.receiveShadow = true;
  scene.add(bed);
  // 작물(양상추 느낌의 낮은 판)
  const crop = new THREE.Mesh(
    new THREE.BoxGeometry(RACK.w * 0.92, 0.07, RACK.d * 0.82), plantMat);
  crop.position.copy(V(RACK.x, RACK.y, z + 0.06));
  crop.receiveShadow = true;
  scene.add(crop);
}

/* ── LED 바 + 배광 ───────────────────────────────────── */
const LED_COLOR = 0xff59c0;
const ledMat = new THREE.MeshStandardMaterial({
  color: LED_COLOR, emissive: LED_COLOR, emissiveIntensity: 2.2 });
const lightGroup = new THREE.Group();
scene.add(lightGroup);

function coneGeom(topW, topD, botW, botD, h) {
  // 배광 볼륨: 위(바) 사각 -> 아래(선반) 사각 절두체
  const g = new THREE.BufferGeometry();
  const t = [[-topW / 2, -topD / 2], [topW / 2, -topD / 2],
             [topW / 2, topD / 2], [-topW / 2, topD / 2]];
  const b = [[-botW / 2, -botD / 2], [botW / 2, -botD / 2],
             [botW / 2, botD / 2], [-botW / 2, botD / 2]];
  const v = [];
  for (let i = 0; i < 4; i++) {
    const j = (i + 1) % 4;
    v.push(t[i][0], 0, t[i][1],  b[i][0], -h, b[i][1],  b[j][0], -h, b[j][1]);
    v.push(t[i][0], 0, t[i][1],  b[j][0], -h, b[j][1],  t[j][0], 0, t[j][1]);
  }
  g.setAttribute("position", new THREE.Float32BufferAttribute(v, 3));
  g.computeVertexNormals();
  return g;
}

for (let i = 0; i < RACK.leds.length; i++) {
  const zl = RACK.leds[i];
  const zb = RACK.beds[i] + 0.09;            // 아래 선반(작물 윗면)
  const bar = new THREE.Mesh(
    new THREE.BoxGeometry(RACK.w * 0.96, 0.02, 0.10), ledMat);
  bar.position.copy(V(RACK.x, RACK.y, zl));
  lightGroup.add(bar);

  // 실제 광원 — 선반을 진짜로 비춘다 (IES 오면 이 자리가 실측 배광)
  const rl = new THREE.PointLight(LED_COLOR, 1.6, 2.6, 2.0);
  rl.position.copy(V(RACK.x, RACK.y, zl - 0.02));
  rl.castShadow = true;
  lightGroup.add(rl);

  // 배광 볼륨(반투명) — "빛이 이렇게 퍼진다"
  const spread = 0.55;                        // 반확산 근사 (IES 대체)
  const cone = new THREE.Mesh(
    coneGeom(RACK.w * 0.96, 0.10, RACK.w * 0.96 + spread, RACK.d + spread,
             zl - zb),
    new THREE.MeshBasicMaterial({ color: LED_COLOR, transparent: true,
                                  opacity: 0.10, side: THREE.DoubleSide,
                                  depthWrite: false }));
  cone.position.copy(V(RACK.x, RACK.y, zl));
  lightGroup.add(cone);
}

/* ── 보조광 ──────────────────────────────────────────── */
scene.add(new THREE.AmbientLight(0x404046, 0.9));
const sun = new THREE.DirectionalLight(0xffffff, 0.5);
sun.position.set(3, 6, -4);
sun.castShadow = true;
scene.add(sun);

/* ── 커스텀 궤도 카메라 (의존성 없이) ─────────────────── */
let th = -0.9, ph = 0.42, rad = 7.5;
const target = V(4.0, 2.3, 1.1);
function applyCam() {
  camera.position.set(
    target.x + rad * Math.cos(ph) * Math.cos(th),
    target.y + rad * Math.sin(ph),
    target.z + rad * Math.cos(ph) * Math.sin(th));
  camera.lookAt(target);
}
let drag = null;
addEventListener("pointerdown", e => { drag = [e.clientX, e.clientY]; });
addEventListener("pointerup", () => { drag = null; });
addEventListener("pointermove", e => {
  if (!drag) return;
  th += (e.clientX - drag[0]) * 0.006;
  ph = Math.min(1.45, Math.max(0.05, ph + (e.clientY - drag[1]) * 0.004));
  drag = [e.clientX, e.clientY];
});
addEventListener("wheel", e => {
  rad = Math.min(16, Math.max(2.5, rad * (e.deltaY > 0 ? 1.1 : 0.9)));
}, { passive: true });
addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ── 조명 토글 ───────────────────────────────────────── */
let lightOn = true;
document.getElementById("btnLight").addEventListener("click", () => {
  lightOn = !lightOn;
  lightGroup.visible = lightOn;
  document.getElementById("btnLight").textContent =
    lightOn ? "조명 끄기" : "조명 켜기";
});

(function loop() {
  applyCam();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
